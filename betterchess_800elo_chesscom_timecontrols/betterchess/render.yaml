services:
  - type: web
    name: betterchess
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      # Optional: set your custom domain, e.g. https://yourchess.com (no trailing slash).
      # If unset, the Render URL is used automatically.
      # - key: SITE_URL
      #   value: https://yourchess.com
      # Free accounts storage (Supabase) - see README "100% free setup":
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_KEY
      #   sync: false
      # Free email sending (Brevo):
      # - key: BREVO_API_KEY
      #   sync: false
      # - key: MAIL_FROM
      #   value: BetterChess <your-verified-sender@example.com>
